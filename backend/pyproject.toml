[project]
name = "adaptive-browser-agent"
version = "0.1.0"
description = "Adaptive research agent built on browser-use"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "aiosqlite>=0.20,<1",
    "alembic>=1.16,<2",
    "anyio>=4,<5",
    "asyncpg>=0.30,<1",
    "browser-use",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "sqlalchemy[asyncio]>=2.0,<3",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "pytest-asyncio>=0.25,<2",
    "ruff>=0.14,<1",
]

[tool.uv.sources]
browser-use = { path = "../browser-use", editable = true }

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adaptive_research"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", ".."]
addopts = "-m 'not browser'"
markers = ["browser: opt-in test that launches a real local Chromium browser"]

[tool.ruff]
target-version = "py312"
src = ["src", ".."]

[tool.ruff.lint.isort]
known-first-party = ["adaptive_research", "tests", "scripts"]
